# Semgrep 安全审计：多语言 SAST，补 Bandit 覆盖不到的规则类别。
name: Semgrep 安全审计
on:
  push:
    branches: [master]
  pull_request:
jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 Semgrep
        run: pip install semgrep
      - name: 扫描并输出 SARIF
        run: semgrep scan --config auto --sarif --output semgrep.sarif --severity ERROR --error .
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
