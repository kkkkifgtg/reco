[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "reco-core"
version = "0.1.0"
description = "核心领域模型与口味画像（公开 API 占位，待 T2 起填充）"
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/reco_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
