[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "reco-labels"
version = "0.1.0"
description = "标签体系与文本统计量（不落正文；公开 API 占位，待 T4 起填充）"
requires-python = ">=3.12"
dependencies = [
  "reco-core",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reco_labels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
