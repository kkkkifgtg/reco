[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "reco-labels"
version = "0.1.0"
description = "标签体系、自动打标与待确认提案"
requires-python = ">=3.12"
dependencies = [
  "reco-core",
  "reco-relations",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reco_labels"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: 跨包集成测试"]
