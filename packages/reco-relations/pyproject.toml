[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "reco-relations"
version = "0.1.0"
description = "人物关系图提取、人工覆盖与相似度"
requires-python = ">=3.12"
dependencies = [
  "reco-core",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reco_relations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: 跨包集成测试"]
