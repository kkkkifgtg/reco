[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "reco-store"
version = "0.1.0"
description = "SQLite 事件存储、投影与推荐读取"
requires-python = ">=3.12"
dependencies = [
  "reco-core",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reco_store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: 跨包集成测试"]
