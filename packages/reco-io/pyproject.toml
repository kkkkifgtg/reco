[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "reco-io"
version = "0.1.0"
description = "导入导出与推荐专区写盘（公开 API 占位，待 T6 起填充）"
requires-python = ">=3.12"
dependencies = [
  "reco-store",
  "reco-labels",
  "reco-relations",
  "pypdf>=7.1",  # W17：PDF 文本层读取（wheels/ 缓存 + 断网演练）
]

[tool.hatch.build.targets.wheel]
packages = ["src/reco_io"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
