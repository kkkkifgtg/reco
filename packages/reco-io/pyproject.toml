[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "reco-io"
version = "0.1.0"
description = "目录扫描、格式读取、特征提取、标签挖掘与落位"
requires-python = ">=3.12"
dependencies = [
  "reco-store",
  "reco-labels",
  "reco-relations",
  "pypdf>=7.1",  # PDF 文本层读取
  "zhconv>=1.4.3",  # 标签挖掘的繁简归一
]

[tool.hatch.build.targets.wheel]
packages = ["src/reco_io"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: 跨包集成测试"]
