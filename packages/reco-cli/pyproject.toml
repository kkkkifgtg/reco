[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "reco-cli"
version = "0.1.0"
description = "reco 命令行入口"
requires-python = ">=3.12"
dependencies = [
  "reco-core",
  "reco-io",
  "reco-labels",
  "reco-store",
]

[project.scripts]
reco = "reco_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reco_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: 跨包集成测试"]
