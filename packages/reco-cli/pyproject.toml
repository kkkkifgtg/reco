[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "reco-cli"
version = "0.1.0"
description = "无界面命令行入口（T0 占位，真实命令待 T10）"
requires-python = ">=3.12"
dependencies = [
  "reco-core",
  "reco-io",
  "reco-store",
]

[project.scripts]
reco = "reco_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reco_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
