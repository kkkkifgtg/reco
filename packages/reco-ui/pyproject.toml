[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "reco-ui"
version = "0.1.0"
description = "PyQt6 桌面 GUI 入口（工单 12；PyQt6 只允许 reco_ui.qt 引用，§11.5）"
requires-python = ">=3.12"
dependencies = [
  "reco-core",
  "reco-io",
  "reco-store",
  "PyQt6>=6.12",
]

[project.scripts]
reco-ui = "reco_ui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reco_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
