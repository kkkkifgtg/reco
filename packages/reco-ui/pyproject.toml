[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "reco-ui"
version = "0.1.0"
description = "PyQt6 桌面入口（Qt 适配集中在 reco_ui.qt）"
requires-python = ">=3.12"
dependencies = [
  "reco-core",
  "reco-io",
  "reco-labels",
  "reco-store",
  "PyQt6>=6.12",
]

[project.scripts]
reco-ui = "reco_ui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reco_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: 跨包集成测试"]
